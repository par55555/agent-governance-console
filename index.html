<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Governance Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
/* Layout: fixed top bar, process rail on the left, open workspace on the right, agent detail as an overlay.
   One visual world (light only). Seven tokens; color appears only where a leader should notice something. */
:root {
  color-scheme: light;
  /* palette: navy (ink + primary), sand (frames), tangerine (accent + attention) */
  --color-base: #FFFFFF;
  --color-ink: #1B2A4A;        /* navy: text */
  --color-navy: #1B2A4A;       /* navy: primary actions, selected, data */
  --color-slate: #4F586C;      /* secondary text; AA on white, surface and sand */
  --color-mist: #E6DCCB;       /* warm hairlines and borders */
  --color-sand: #E8D8B9;       /* sprite frames, warm accents */
  --color-clay: #8C7550;        /* sand darkened: data pool rims, tier 3 sprite body */
  --color-frame: #F4F6F8;      /* page title frame (neutral grey) */
  --surface: #F8F3EA;          /* process rail, quiet fills */
  --color-tangerine: #F28C28;  /* accent fills only (indicators, markers); never text, fails AA */
  --color-orange: #9A4700;     /* text-safe tangerine: writes into another process, degraded */
  --color-crimson: #B42318;    /* incident, error */
  /* permitted tints */
  --navy-8: rgba(27, 42, 74, .07);
  --orange-8: #FDF1E5;
  --crimson-8: rgba(180, 35, 24, .08);
  --ink-scrim: rgba(27, 42, 74, .32);
  /* home stage only (the one place gradients and depth are allowed): navy deepened and lifted */
  --navy-deep: #0D1628;
  --navy-lift: #2E4676;
  --font-serif: 'Source Serif 4', 'Source Serif Pro', Georgia, 'Times New Roman', serif;
  --font-sans: 'IBM Plex Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-code: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  /* type scale, ratio 1.25 */
  --fs-13: 13px; --fs-16: 16px; --fs-20: 20px; --fs-25: 25px; --fs-31: 31px; --fs-39: 39px;
  --s1: 8px; --s2: 16px; --s3: 24px; --s4: 32px; --s6: 48px; --s8: 64px; --s12: 96px;
  --r-ctl: 4px; --r-panel: 8px;
  --overlay-shadow: 0 16px 48px rgba(27, 42, 74, .18);
  --ease: 160ms ease-out;
}
@media (prefers-reduced-motion: reduce) { :root { --ease: 0ms linear; } }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--color-base); color: var(--color-ink); font: 400 var(--fs-16)/1.5 var(--font-sans); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
body.modal-open { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--color-navy); outline-offset: 2px; border-radius: 2px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; font-weight: 600; }
b, strong { font-weight: 600; }
.mono { font-family: inherit; }
.muted { color: var(--color-slate); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.ic.mini { width: 13px; height: 13px; vertical-align: -2px; }
.serif { font-family: var(--font-serif); }

/* ---------- shell */
.app { display: grid; grid-template-columns: 264px minmax(0, 1fr); grid-template-rows: 64px minmax(0, 1fr); height: 100%; }
.topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: var(--s3); padding: 0 var(--s3); border-bottom: 1px solid var(--color-mist); min-width: 0; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-mark { width: 32px; height: 32px; border-radius: var(--r-ctl); background: var(--color-navy); display: grid; place-items: center; flex: none; }
.brand-mark canvas { image-rendering: pixelated; }
.brand-name { font-weight: 600; font-size: var(--fs-16); white-space: nowrap; }
.brand-tenant { color: var(--color-slate); font-size: var(--fs-13); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-mid { flex: 1; display: flex; justify-content: center; min-width: 0; }
.gs { position: relative; width: min(440px, 100%); }
.gs label { display: flex; align-items: center; gap: var(--s1); height: 40px; padding: 0 12px; border: 1px solid var(--color-mist); border-radius: var(--r-ctl); color: var(--color-slate); }
.gs label:focus-within { border-color: var(--color-navy); }
.gs input { border: 0; background: transparent; outline: 0; flex: 1; min-width: 0; color: var(--color-ink); }
.gs input::placeholder, .search-in input::placeholder, .fld input::placeholder, .fld textarea::placeholder, .row input::placeholder, .lrow input::placeholder { color: var(--color-slate); opacity: .8; }
#gs-results { position: absolute; top: 46px; left: 0; right: 0; background: var(--color-base); border: 1px solid var(--color-mist); border-radius: var(--r-panel); box-shadow: var(--overlay-shadow); padding: var(--s1); z-index: 40; max-height: 60vh; overflow: auto; }
.gs-hit { display: flex; align-items: center; gap: 12px; width: 100%; padding: var(--s1); border: 0; background: transparent; border-radius: var(--r-ctl); text-align: left; transition: background var(--ease); }
.gs-hit:hover, .gs-hit:focus-visible { background: var(--navy-8); }
.gs-n { flex: 1; font-weight: 500; }
.gs-none { padding: 12px; color: var(--color-slate); }
.top-r { display: flex; align-items: center; gap: var(--s2); }
.asof { color: var(--color-slate); font-size: var(--fs-13); white-space: nowrap; }

/* segmented controls */
.seg { display: inline-flex; border: 1px solid var(--color-mist); border-radius: var(--r-ctl); overflow: hidden; flex-wrap: wrap; }
.seg-btn { display: inline-flex; align-items: center; gap: 6px; border: 0; border-right: 1px solid var(--color-mist); background: var(--color-base); padding: 6px 12px; color: var(--color-slate); font-size: var(--fs-13); white-space: nowrap; transition: background var(--ease), color var(--ease); }
.seg-btn:last-child { border-right: 0; }
.seg-btn:hover { color: var(--color-ink); background: var(--navy-8); }
.seg-btn.on { background: var(--navy-8); color: var(--color-navy); font-weight: 600; }
.seg-n { color: inherit; opacity: .75; font-weight: 400; }
.seg .ic { width: 14px; height: 14px; }

/* ---------- process rail */
.nav { overflow-y: auto; background: var(--surface); border-right: 1px solid var(--color-mist); padding: var(--s3) var(--s2) var(--s6); }
.nav-all { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 10px 12px; border: 0; background: transparent; border-radius: var(--r-ctl); font-weight: 600; text-align: left; transition: background var(--ease); }
.nav-all:hover { background: var(--navy-8); }
.nav-all.on { background: var(--color-base); color: var(--color-navy); box-shadow: inset 3px 0 0 var(--color-tangerine), inset 0 0 0 1px var(--color-mist); }
.nav-tier { margin-top: var(--s3); }
.nav-tier-h { display: flex; align-items: center; gap: var(--s1); width: 100%; padding: 4px 12px 8px; border: 0; background: transparent; font-size: var(--fs-13); font-weight: 600; color: var(--color-slate); text-align: left; }
.nav-tier-h:hover { color: var(--color-ink); }
.nav-tier-h .chev { margin-left: auto; width: 14px; height: 14px; transition: transform var(--ease); }
.nav-tier.collapsed .chev { transform: rotate(-90deg); }
.nav-tier.collapsed .nav-list { display: none; }
.nav-list { list-style: none; margin: 0; padding: 0; }
.nav-item { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 4px; width: 100%; padding: 8px 12px; border: 0; background: transparent; border-radius: var(--r-ctl); text-align: left; color: var(--color-ink); font-size: 15px; transition: background var(--ease); }
.nav-item:hover { background: var(--navy-8); }
.nav-item.on { background: var(--color-base); color: var(--color-navy); font-weight: 600; box-shadow: inset 3px 0 0 var(--color-tangerine), inset 0 0 0 1px var(--color-mist); }
.nav-code { font-size: var(--fs-13); color: var(--color-slate); font-weight: 500; }
.nav-item.on .nav-code { color: var(--color-navy); }
.nav-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-n { font-size: var(--fs-13); color: var(--color-slate); min-width: 16px; text-align: right; font-weight: 400; }
.sw { display: none; }

/* ---------- workspace */
.main { overflow-y: auto; padding: var(--s6) var(--s6) var(--s12); min-width: 0; }
.main > * { max-width: 1280px; }
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 12px var(--s2); border-top: 1px solid var(--color-mist); border-bottom: 1px solid var(--color-mist); color: var(--color-slate); font-size: var(--fs-13); margin-bottom: var(--s4); }
.notice .ic { margin-top: 2px; }
.notice.sm { margin-bottom: var(--s3); }
.notice.warn { color: var(--color-orange); background: var(--orange-8); border-color: transparent; border-radius: var(--r-ctl); }

/* process header: the hero is the narrative */
.bp-head { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--s3) var(--s6); padding: 40px; margin-bottom: var(--s6); background: var(--color-frame); border-radius: var(--r-panel); }
.bp-head > * { grid-column: 1; }
.bp-head h1 { font-family: var(--font-serif); font-size: var(--fs-39); font-weight: 600; line-height: 1.15; letter-spacing: -.01em; }
.bp-head h1 .alt { display: none; }
.owner { margin: var(--s1) 0 0; color: var(--color-slate); }
.lead { margin: var(--s1) 0 0; font-family: var(--font-serif); font-size: var(--fs-20); line-height: 1.6; max-width: 66ch; color: var(--color-ink); }
.attn { display: flex; flex-direction: column; gap: var(--s1); margin: 0; padding: 0; list-style: none; }
.attn li { display: flex; gap: 10px; align-items: flex-start; font-size: var(--fs-16); }
.attn li .ic { margin-top: 3px; }
.attn li.degraded { color: var(--color-orange); }
.attn li.incident { color: var(--color-crimson); }
.attn li button { border: 0; background: none; padding: 0; color: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.subs { display: flex; flex-wrap: wrap; gap: var(--s1); margin: 0; }
.subs-l { color: var(--color-slate); font-size: var(--fs-13); margin-right: 4px; align-self: center; }
.sub { font-size: var(--fs-13); padding: 3px 10px; border-radius: var(--r-ctl); border: 1px solid var(--color-mist); color: var(--color-ink); }
.bp-head .subs { order: 1; grid-column: 1 / -1; flex-wrap: nowrap; align-items: center; gap: 12px; margin-top: var(--s1); padding-top: var(--s3); border-top: 1px solid var(--color-mist); overflow-x: auto; scrollbar-width: thin; }
.seg.steps { flex-wrap: nowrap; flex: none; background: var(--color-base); }
.seg.steps .seg-btn { padding: 6px 9px; gap: 5px; }
.seg.steps .seg-btn.none { color: var(--color-slate); }
.seg.steps .seg-btn.none .seg-n { opacity: .7; }
/* step tab pinned flush to the tile's top-right corner, above the content */
.tile-step { position: absolute; top: 0; right: 0; max-width: 70%; font-size: 12px; line-height: 20px; color: var(--color-slate); padding: 0 10px; background: var(--surface); border-left: 1px solid var(--color-mist); border-bottom: 1px solid var(--color-mist); border-radius: 0 7px 0 var(--r-ctl); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile:hover .tile-step { background: var(--color-base); }
.bp-head .owner, .bp-head .p-sum, .bp-head .subs-l { color: var(--color-slate); }
.spark { grid-column: 2; grid-row: 1 / span 4; align-self: start; background: var(--color-base); border-radius: var(--r-panel); padding: var(--s3); }
.spark-n { margin-top: var(--s3); padding-top: var(--s3); border-top: 1px solid var(--color-mist); }
.spark-n .spark-l b { color: var(--color-ink); font-weight: 600; }
.spark-v { font-size: var(--fs-31); font-weight: 600; line-height: 1.1; }
.spark-l { color: var(--color-slate); font-size: var(--fs-13); margin-top: 4px; }
.spark svg { display: block; width: 100%; height: 56px; margin-top: var(--s2); overflow: visible; }
.spark .sl { fill: none; stroke: var(--color-navy); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.spark .sd { fill: var(--color-tangerine); stroke: var(--color-navy); stroke-width: 1.5; }
.spark .sb { stroke: var(--color-mist); stroke-width: 1; }
.spark-c { font-size: var(--fs-13); color: var(--color-slate); margin-top: var(--s1); }

.sec { margin-bottom: var(--s8); }
.sec-h { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--s2); margin-bottom: var(--s2); }
.sec-h h2 { font-size: var(--fs-25); font-weight: 600; display: flex; align-items: center; gap: 12px; letter-spacing: -.005em; }
.count { font-size: var(--fs-16); font-weight: 400; color: var(--color-slate); }
.sec-sub { margin: 0 0 var(--s3); color: var(--color-slate); max-width: 70ch; }
.sec-note { color: var(--color-slate); font-size: var(--fs-13); }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s1); }
.search-in { display: flex; align-items: center; gap: var(--s1); height: 36px; padding: 0 10px; border: 1px solid var(--color-mist); border-radius: var(--r-ctl); color: var(--color-slate); }
.search-in input { border: 0; outline: 0; background: transparent; width: 220px; color: var(--color-ink); font-size: 15px; }
.search-in:focus-within { border-color: var(--color-navy); }
.sel select { height: 36px; border: 1px solid var(--color-mist); background: var(--color-base); border-radius: var(--r-ctl); padding: 0 10px; font-size: 15px; }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); margin: 0 0 var(--s3); }
.legend { margin: 0 0 0 auto; font-size: var(--fs-13); }
.legend[open] { flex-basis: 100%; margin-left: 0; }
.legend summary { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--color-navy); list-style: none; font-weight: 500; }
.legend summary::-webkit-details-marker { display: none; }
.legend-body { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s4); margin-top: var(--s2); padding: var(--s3) 0; border-top: 1px solid var(--color-mist); border-bottom: 1px solid var(--color-mist); font-size: var(--fs-16); }
.legend h4 { font-size: var(--fs-16); margin-bottom: 12px; }
.legend ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.legend li { display: flex; gap: 10px; align-items: flex-start; color: var(--color-slate); line-height: 1.45; }
.legend li b { color: var(--color-ink); }
.legend li .ic, .legend li .chip, .legend li .auto { margin-top: 3px; flex: none; }

/* ---------- tiles: distinct clickable objects, so they keep a hairline border */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--s2); }
.grid.compact { grid-template-columns: repeat(auto-fill, minmax(216px, 1fr)); gap: 12px; }
.tile { position: relative; display: flex; flex-direction: column; gap: var(--s2); text-align: left; padding: 36px var(--s3) var(--s3); background: var(--color-base); border: 1px solid var(--color-mist); border-radius: var(--r-panel); min-width: 0; transition: background var(--ease), border-color var(--ease); }
.tile:hover { background: var(--navy-8); border-color: transparent; }
.tile-top { display: flex; align-items: flex-start; gap: 12px; min-width: 0; }
.tile-id { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
.tile-name { font-weight: 600; font-size: var(--fs-16); line-height: 1.3; }
.tile-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 12px; }
.tile-stats { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); }
.stat b { display: block; font-size: var(--fs-25); font-weight: 600; line-height: 1.15; }
.stat small { display: block; font-size: var(--fs-13); color: var(--color-slate); margin-top: 2px; }
.tile-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 24px; padding-top: var(--s2); border-top: 1px solid var(--color-mist); }
.tile:hover .tile-foot { border-top-color: rgba(27, 42, 74, .16); }
.foot-l { font-size: var(--fs-13); color: var(--color-slate); margin-right: 4px; }
.grid.compact .tile { padding: 32px var(--s2) var(--s2); gap: 12px; }
.grid.compact .pix canvas { width: 32px !important; height: 32px !important; }
.grid.compact .tile-meta .arch { font-size: 0; gap: 0; }
.grid.compact .stat b { font-size: var(--fs-20); }
.pix { display: grid; place-items: center; background: var(--color-mist); border-radius: var(--r-ctl); padding: 6px; flex: none; }
.pix.sm { padding: 3px; }
.pix.lg { padding: 10px; border-radius: var(--r-panel); }
.sprite { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
.arch { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-13); color: var(--color-slate); white-space: nowrap; }
.arch .ic { width: 14px; height: 14px; }
.auto { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-13); color: var(--color-slate); white-space: nowrap; }
.auto-bars { display: inline-flex; gap: 2px; align-items: flex-end; }
.auto-bars i { width: 4px; border-radius: 1px; background: var(--color-mist); }
.auto-bars i:nth-child(1) { height: 6px; } .auto-bars i:nth-child(2) { height: 9px; } .auto-bars i:nth-child(3) { height: 12px; }
.auto-bars i.on { background: var(--color-slate); }

/* process labels: neutral unless the agent writes into that process */
.chip { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: var(--r-ctl); font: 600 var(--fs-13)/1 var(--font-sans); border: 1px solid var(--color-mist); color: var(--color-ink); background: var(--color-base); white-space: nowrap; }
.chip .ic { width: 12px; height: 12px; stroke-width: 1.75; }
.chip.w { color: var(--color-orange); background: var(--orange-8); border-color: transparent; }
.chip.home { border-color: var(--color-mist); }
.chip-long { font-weight: 400; color: var(--color-ink); }
.chips { display: inline-flex; flex-wrap: wrap; gap: 6px; }

.health, .status { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-13); font-weight: 600; white-space: nowrap; flex: none; }
.health .ic { width: 14px; height: 14px; stroke-width: 1.75; }
.health.healthy { color: var(--color-navy); }
.health.degraded { color: var(--color-orange); }
.health.incident { color: var(--color-crimson); }
.health.unknown { color: var(--color-slate); font-weight: 500; }
.status { color: var(--color-slate); font-weight: 500; padding: 1px 8px; border: 1px solid var(--color-mist); border-radius: var(--r-ctl); }
.status.s-production { border-color: transparent; padding-left: 0; }

/* cross-process list: hairline rows, not cards */
.xlist { border-top: 1px solid var(--color-mist); }
.xrow { display: grid; grid-template-columns: auto minmax(200px, 1.4fr) minmax(160px, 1fr) minmax(160px, 1.1fr) minmax(150px, 1fr) auto; align-items: center; gap: var(--s3); width: 100%; padding: var(--s2) 12px; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--color-mist); transition: background var(--ease); }
.xrow:hover { background: var(--navy-8); }
.xrow small { display: block; font-size: var(--fs-13); color: var(--color-slate); margin-bottom: 6px; }
.x-id { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.x-name { font-weight: 600; }
.x-meta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.via-list { display: flex; flex-wrap: wrap; gap: 6px; }
.via { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-13); color: var(--color-ink); white-space: nowrap; }
.via + .via::before { content: ''; width: 3px; height: 3px; border-radius: 50%; background: var(--color-mist); margin-right: 4px; }
.via.w { color: var(--color-orange); font-weight: 600; }
.via .ic { width: 13px; height: 13px; }
.x-stats { display: flex; gap: var(--s3); }
.x-stats b { display: block; font-size: var(--fs-20); font-weight: 600; }
.x-stats small { margin: 0; }
.empty { padding: var(--s6) var(--s3); text-align: center; color: var(--color-slate); border-top: 1px solid var(--color-mist); border-bottom: 1px solid var(--color-mist); }
.empty .btn { margin-top: var(--s2); }

/* ---------- all processes */
/* ---------- home: the enterprise stack */
.home-head { padding: var(--s3) var(--s4); overflow-x: auto; }
.stack-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--s2) var(--s3); }
.stack-key { display: flex; flex-wrap: wrap; gap: 6px var(--s3); margin: 0; padding: 0; list-style: none; font-size: var(--fs-13); color: var(--color-slate); }
.stack-key li { display: inline-flex; align-items: center; gap: 6px; }
.stack-key i { display: inline-block; flex: none; }
.k-ag { width: 8px; height: 8px; border-radius: 1.5px; background: var(--color-navy); }
.k-arc { width: 22px; height: 0; border-top: 2px solid var(--color-navy); opacity: .45; }
.k-arc.w { border-top-color: var(--color-tangerine); opacity: 1; }
.k-pool { width: 18px; height: 8px; border-radius: 50%; background: var(--color-sand); box-shadow: inset 0 0 0 1px var(--color-clay); }

.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 15px; }

/* ---------- agent detail overlay */
#modal { position: fixed; inset: 0; z-index: 50; background: var(--ink-scrim); display: grid; place-items: center; padding: var(--s3); }
#modal[hidden] { display: none; }
.m-card { width: min(1160px, 100%); max-height: calc(100% - 8px); display: flex; flex-direction: column; background: var(--color-base); border-radius: var(--r-panel); box-shadow: var(--overlay-shadow); overflow: hidden; }

.m-id { flex: 1; min-width: 0; display: grid; gap: var(--s1); }

.m-alert { display: flex; gap: 10px; align-items: flex-start; margin: 0 var(--s4) var(--s2); padding: 12px var(--s2); border-radius: var(--r-ctl); font-size: 15px; }
.m-alert .ic { margin-top: 2px; }
.m-alert.degraded { background: var(--orange-8); color: var(--color-orange); }
.m-alert.incident { background: var(--crimson-8); color: var(--color-crimson); }
.m-cross { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; padding: 0 var(--s4) var(--s2); font-size: 15px; }

.m-cross-w { display: inline-flex; align-items: center; gap: 6px; color: var(--color-orange); font-weight: 600; }
.m-cross-r { color: var(--color-slate); }
.tabs { display: flex; gap: var(--s3); padding: 0 var(--s4); border-bottom: 1px solid var(--color-mist); overflow-x: auto; }
.tab { border: 0; background: transparent; padding: 12px 0 10px; font-size: 15px; color: var(--color-slate); border-bottom: 2px solid transparent; white-space: nowrap; transition: color var(--ease); }
.tab:hover { color: var(--color-ink); }
.tab.on { color: var(--color-ink); font-weight: 600; border-bottom-color: var(--color-tangerine); }
.m-body { overflow-y: auto; padding: var(--s4) var(--s4) var(--s6); }
.m-body h3 { font-size: var(--fs-20); font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: var(--s1); }
.m-body h3.mt { margin-top: var(--s6); }
.ov-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(280px, 1fr); gap: var(--s6); }
.ov-desc p { margin: 0 0 var(--s3); max-width: 68ch; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 10px var(--s3); margin: 0; font-size: 15px; }
.kv dt { color: var(--color-slate); }
.kv dd { margin: 0; }
.gov { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--color-mist); }
.gov li { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); padding: 12px 0; border-bottom: 1px solid var(--color-mist); font-size: 15px; }

.warn-t { color: var(--color-orange); } .crit-t { color: var(--color-crimson); }
.gov-note { margin: 12px 0 0; font-size: var(--fs-13); color: var(--color-slate); }
.home-why { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: start; gap: var(--s2) var(--s6); padding: 0 0 var(--s4); margin-bottom: var(--s4); border-bottom: 1px solid var(--color-mist); }

.hw-note { display: block; margin-top: 6px; font-family: var(--font-sans); font-size: var(--fs-13); color: var(--color-slate); }
.fp-wrap { overflow-x: auto; }
.fp { width: 100%; border-collapse: collapse; font-size: 15px; }
.fp th, .fp td { padding: 12px; border-bottom: 1px solid var(--color-mist); vertical-align: top; text-align: left; }

.fp-name { display: block; }

.fp-i { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s1); padding: 2px 0; }

.sys-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0 var(--s4); border-top: 1px solid var(--color-mist); }

.spec-top { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(260px, 1fr); gap: var(--s6); }
pre.code { margin: 0; padding: var(--s2) 20px; background: var(--surface); border: 1px solid var(--color-mist); border-radius: var(--r-panel); font: 13.5px/1.65 var(--font-code); white-space: pre-wrap; word-break: break-word; max-height: 380px; overflow: auto; color: var(--color-ink); }

.md-bar { display: flex; justify-content: space-between; align-items: center; padding: 0 0 12px; font-size: var(--fs-13); }
.md pre.code { margin: 0 0 var(--s2); max-height: 520px; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--color-mist); background: var(--color-base); border-radius: var(--r-ctl); padding: 8px 14px; font-size: 15px; font-weight: 500; color: var(--color-ink); transition: background var(--ease); white-space: nowrap; }

.btn.sm { padding: 6px 10px; font-size: var(--fs-13); }
.btn.primary { background: var(--color-navy); border-color: var(--color-navy); color: var(--color-base); font-weight: 600; }
.btn.primary:hover { background: var(--color-ink); border-color: var(--color-ink); }
.btn[disabled], .btn.primary[disabled] { opacity: .4; cursor: not-allowed; }
.btn.danger { background: var(--color-crimson); border-color: var(--color-crimson); color: var(--color-base); font-weight: 600; }

.add-btn { margin-left: var(--s1); }

/* consumption tab */
.use-lead { font-family: var(--font-serif); font-size: var(--fs-25); line-height: 1.45; margin: 0 0 var(--s3); max-width: 40ch; }
.figs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 0 0 var(--s6); border-top: 1px solid var(--color-mist); border-bottom: 1px solid var(--color-mist); }

.figs div + div { padding-left: var(--s2); border-left: 1px solid var(--color-mist); }
.figs dt { font-size: var(--fs-13); color: var(--color-slate); }
.figs dd { margin: 4px 0 0; font-size: var(--fs-20); font-weight: 600; }

.chart-card { margin-bottom: var(--s6); }
.chart-h { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s2); margin-bottom: var(--s1); font-size: var(--fs-13); }
.chart-h h3 { margin: 0 !important; }
.chart svg { width: 100%; height: 220px; display: block; overflow: visible; }
.chart .base { stroke: var(--color-mist); stroke-width: 1; }
.chart .ax { fill: var(--color-slate); font: 12px var(--font-sans); font-variant-numeric: tabular-nums; }

.chart .end, .chart .hov { fill: var(--color-navy); stroke: var(--color-base); stroke-width: 2; }
.chart .xh { stroke: var(--color-slate); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .hit { fill: transparent; cursor: crosshair; }
.chart .band { fill: var(--surface); }
.chart .band-l { fill: var(--color-slate); font: 500 12px var(--font-sans); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s6); margin-bottom: var(--s6); }
.sec-sub.s { margin-bottom: var(--s2); font-size: 15px; }
.hbar { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 6px 0; font-size: 15px; }
.hb-l { display: flex; align-items: center; gap: 8px; min-width: 0; }
.hb-role { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb-track { height: 8px; }
.hb-track i { display: block; height: 100%; border-radius: 0 4px 4px 0; background: var(--color-slate); }
.hb-track i.home { background: var(--color-navy); }
.hb-track i.neutral { background: var(--color-ink); }
.hb-v { font-weight: 600; min-width: 44px; text-align: right; }
.cost { font-size: 15px; }
.cost th { padding: 8px 0; }

.cost tfoot td { font-weight: 600; border-bottom: 0; }
.fine { font-size: var(--fs-13); color: var(--color-slate); margin: 12px 0 0; }
.plain { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 15px; }
.value-empty { padding: var(--s8) var(--s3); text-align: center; border-top: 1px solid var(--color-mist); border-bottom: 1px solid var(--color-mist); }

.ve-mark { display: none; }
.card, .ov-desc, .ov-gov, .chart-card { min-width: 0; }

/* overlays: tooltip, toast */

#toast { position: fixed; left: 50%; bottom: var(--s3); transform: translateX(-50%); z-index: 90; background: var(--color-ink); color: var(--color-base); padding: 12px 20px; border-radius: var(--r-ctl); box-shadow: var(--overlay-shadow); font-size: 15px; max-width: min(560px, calc(100% - 32px)); }

/* registry connection */

.src-pill.err { color: var(--color-crimson); font-weight: 600; } .src-pill.err i { background: var(--color-crimson); }
.state-view { max-width: 560px; margin: 16vh 0 0; }
.state-view h2 { font-family: var(--font-serif); font-size: var(--fs-31); margin-bottom: var(--s1); }

.spinner { display: none; }
.h1-row { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s2); flex-wrap: wrap; }

/* ---------- add / edit form */
#form { position: fixed; inset: 0; z-index: 60; background: var(--ink-scrim); display: grid; place-items: center; padding: var(--s3); }
#form[hidden] { display: none; }
.f-card { width: min(1280px, 100%); height: min(940px, 100%); display: flex; flex-direction: column; background: var(--color-base); border-radius: var(--r-panel); box-shadow: var(--overlay-shadow); overflow: hidden; }
.f-head { display: flex; justify-content: space-between; gap: var(--s3); align-items: flex-start; padding: var(--s4) var(--s4) var(--s3); border-bottom: 1px solid var(--color-mist); }
.f-head .eyebrow { display: flex; align-items: center; gap: 8px; color: var(--color-slate); font-size: var(--fs-13); }
.f-head h2 { font-family: var(--font-serif); font-size: var(--fs-31); font-weight: 600; margin: 4px 0; }
.f-sub { margin: 0; color: var(--color-slate); }
.req { color: var(--color-crimson); font-weight: 600; }
.f-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 336px; }
.f-main { overflow-y: auto; padding: var(--s3) var(--s4) var(--s6); display: grid; gap: 0; align-content: start; }
.f-side { overflow-y: auto; padding: var(--s3); border-left: 1px solid var(--color-mist); display: grid; gap: var(--s3); align-content: start; }
.f-sec { margin: 0; padding: var(--s3) 0; border: 0; border-bottom: 1px solid var(--color-mist); min-width: 0; }
.f-sec:last-of-type { border-bottom: 0; }
.f-sec legend { float: left; width: 100%; padding: 0; margin-bottom: 12px; font-size: var(--fs-20); font-weight: 600; }
.f-sec legend + * { clear: both; }
.f-help { margin: 0 0 var(--s2); color: var(--color-slate); max-width: 72ch; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s2) var(--s3); }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s2) var(--s3); }
.fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fld.full { grid-column: 1 / -1; }
.fld label { font-size: 14px; font-weight: 600; }
.fld input, .fld select, .fld textarea, .row input, .row select, .lrow input { width: 100%; min-width: 0; border: 1px solid var(--color-mist); background: var(--color-base); border-radius: var(--r-ctl); padding: 9px 11px; font-size: var(--fs-16); color: var(--color-ink); }
.fld select, .row select { padding-right: 6px; }
.fld textarea { resize: vertical; line-height: 1.5; }
.fld textarea.mono { font-family: var(--font-code); font-size: 14px; }
.fld input[readonly] { background: var(--surface); color: var(--color-slate); }
.fld input:focus, .fld select:focus, .fld textarea:focus, .row input:focus, .row select:focus, .lrow input:focus { outline: 2px solid var(--color-navy); outline-offset: 0; border-color: transparent; }
.hint { color: var(--color-slate); font-size: var(--fs-13); line-height: 1.45; }
.err { color: var(--color-crimson); font-size: var(--fs-13); font-weight: 500; }
.err.blk { margin: -8px 0 var(--s2); font-size: 15px; }
.has-err > input, .has-err > select, .has-err > textarea, .cell.has-err input { border-color: var(--color-crimson); background: var(--crimson-8); }
.rows { display: grid; gap: var(--s1); margin-bottom: 12px; }
.row, .row-h { display: grid; gap: var(--s1); align-items: start; }
.row-h span { font-size: var(--fs-13); font-weight: 600; color: var(--color-slate); }
.rows-inputs .row, .rows-inputs .row-h, .rows-outputs .row, .rows-outputs .row-h { grid-template-columns: 1.3fr 1.2fr 170px 96px 36px; }
.rows-tools .row, .rows-tools .row-h { grid-template-columns: 1fr 1.2fr 1fr 150px 90px .8fr 36px; }
.rows-users .row, .rows-users .row-h { grid-template-columns: 190px 1fr 100px 36px; }
.row input, .row select { padding: 7px 8px; font-size: 15px; }
.cell { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.list { display: grid; gap: var(--s1); margin-bottom: 12px; }
.lrow { display: grid; grid-template-columns: 1fr 36px; gap: var(--s1); }
.f-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); padding: var(--s2) var(--s4); border-top: 1px solid var(--color-mist); }
.f-msg { font-size: 15px; color: var(--color-slate); }
.f-msg.bad { color: var(--color-crimson); font-weight: 500; }
.f-btns { display: flex; gap: var(--s1); }
.f-btns .btn { padding: 10px 18px; }
.pv-card { display: grid; gap: 12px; padding-bottom: var(--s3); border-bottom: 1px solid var(--color-mist); }
.pv-top { display: flex; gap: 12px; align-items: center; }
.pv-name { display: block; font-size: var(--fs-16); }
.pv-id { display: block; font-size: var(--fs-13); color: var(--color-slate); }
.pv-home { display: flex; align-items: center; gap: 8px; font-weight: 600; flex-wrap: wrap; }
.pv-why { margin: 0; font-family: var(--font-serif); font-size: var(--fs-16); line-height: 1.6; }
.pv-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; }
.pv-sec h4 { font-size: 15px; margin-bottom: 8px; }
.pv-sec p { margin: 0 0 8px; font-size: 15px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pv-sec p.pv-w { display: block; color: var(--color-orange); font-weight: 500; }
.pv-w .ic { width: 14px; height: 14px; vertical-align: -2px; margin-right: 4px; }
.pv-check, .pv-warn { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 15px; }
.pv-check li { display: flex; gap: 8px; align-items: center; color: var(--color-slate); }

.pv-check li.ok .ic { color: var(--color-navy); }
.pv-warn li { display: flex; gap: 8px; align-items: flex-start; color: var(--color-orange); font-size: 14px; }
.pv-warn .ic { margin-top: 2px; }
.pv-md { margin-top: 12px !important; max-height: 360px; font-size: 12px !important; }

/* ---------- responsive: desktop and iPad first */
@media (max-width: 1280px) {
  .main { padding: var(--s4) var(--s4) var(--s8); }
  /* steps stay on one row; when they don't fit, the row scrolls and fades at the right edge */
  .bp-head .subs.more { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 48px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 48px), transparent); }
  .bp-head .subs.more.end { -webkit-mask-image: none; mask-image: none; }
  .xrow { grid-template-columns: auto minmax(0, 1fr) minmax(0, 1fr); row-gap: 12px; }
  .x-targets, .x-stats { grid-column: 2 / -1; }
}

/* ============ standard theme: dark (styled after the reference video). Neon mode: every rule prefixed body.neon.
   Unprefixed .hx-* rules are shared by both themes and take their colors from --fg-rgb / --acc-rgb / --on-acc. */
body.neon {
  color-scheme: dark;
  --color-base: #07090B; --color-ink: #EEF1F4; --color-slate: #8C97A6; --color-mist: rgba(var(--fg-rgb), .09);
  --surface: #0C1013; --color-frame: rgba(var(--fg-rgb), .03); --navy-8: rgba(var(--fg-rgb), .06);
  --color-navy: #C6F24E; --color-orange: #FFA552; --color-crimson: #FF6B5E;
  --hx-lime: #C6F24E; --hx-cyan: #5CC8FF; --hx-line: rgba(var(--fg-rgb), .08); --hx-glass: rgba(var(--fg-rgb), .035);
  background: var(--color-base); color: var(--color-ink);
}
body.neon .topbar { background: rgba(7, 9, 11, .92); border-bottom-color: var(--hx-line); }
body.neon .brand-mark { background: var(--hx-lime); }
body.neon .nav { background: #090C0E; border-right-color: var(--hx-line); }
body.neon .nav-all.on, body.neon .nav-item.on { background: rgba(198, 242, 78, .08); color: var(--hx-lime); box-shadow: inset 2px 0 0 var(--hx-lime); }
body.neon .nav-item.on .nav-code { color: var(--hx-lime); }
body.neon .seg-btn { background: transparent; }
body.neon .seg-btn.on { background: rgba(198, 242, 78, .12); color: var(--hx-lime); }
body.neon .gs label { background: rgba(255, 255, 255, .03); }
.app.home .main { padding: 0; background: var(--color-base); }
.app.home .main > * { max-width: none; }
body.neon .notice.warn { background: rgba(255, 165, 82, .1); }
body.neon :focus-visible { outline-color: var(--hx-lime); }

.hx { position: relative; padding: 0 var(--s6) var(--s8); font-family: var(--font-sans); isolation: isolate; }
.hx > section { max-width: 1240px; margin: 0 auto; }

.hx-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 20px; border-radius: 999px; border: 1px solid var(--hx-line); font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer; transition: transform 180ms ease-out, background 180ms ease-out, box-shadow 180ms ease-out; }
.hx-btn.lime { background: var(--hx-lime); color: var(--on-acc); border-color: var(--hx-lime); box-shadow: 0 0 0 0 rgba(var(--acc-rgb), .0); }

.hx-hero-main { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: var(--s6); margin-bottom: var(--s4); }

.hx-k { font-size: 34px; font-weight: 600; letter-spacing: -.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.hx-kl { font-family: var(--font-code); font-size: 12px; color: var(--color-slate); }

/* glass cards */
.hx-card { position: relative; background: linear-gradient(180deg, rgba(var(--fg-rgb), .05), rgba(var(--fg-rgb), .015)); border: 1px solid var(--hx-line); border-radius: 18px; padding: var(--s3); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: inset 0 1px 0 rgba(var(--fg-rgb), .05), 0 30px 60px -30px rgba(0, 0, 0, .7); }
.hx-card-h { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); margin-bottom: var(--s2); }

/* live map card */
.hx-map { position: relative; padding: var(--s2) var(--s3) var(--s3); background: linear-gradient(180deg, rgba(var(--fg-rgb), .045), rgba(var(--fg-rgb), .012)); border: 1px solid var(--hx-line); border-radius: 22px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: inset 0 1px 0 rgba(var(--fg-rgb), .06), 0 40px 80px -30px rgba(0, 0, 0, .8); }
.hx-map-h { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--hx-line); }

.hx-live { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px; border: 1px solid rgba(var(--acc-rgb), .5); background: rgba(var(--acc-rgb), .1); color: var(--hx-lime); font-family: var(--font-code); font-size: 12px; cursor: pointer; }
.hx-live i { width: 7px; height: 7px; border-radius: 50%; background: var(--hx-lime); box-shadow: 0 0 8px var(--hx-lime); animation: hx-beat 1.4s ease-out infinite; }
.hx-live.off { border-color: var(--hx-line); background: transparent; color: var(--color-slate); }

.hx-live:disabled { opacity: .6; cursor: default; }

body.neon .hinfo[open] summary, body.neon .hinfo summary:hover { background: var(--hx-lime); color: #0A0D08; }
body.neon .hinfo-pop { background: #0E1215; border-color: var(--hx-line); box-shadow: 0 30px 60px rgba(0, 0, 0, .6); }

.o-feed-w { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: var(--s2); align-items: start; margin-top: var(--s2); padding-top: 12px; border-top: 1px solid var(--hx-line); min-height: 98px; }

/* sections */

.hx-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s6); margin-bottom: var(--s4); }
.hx-stat { display: flex; flex-direction: column; gap: 6px; padding-top: var(--s2); border-top: 1px solid var(--hx-line); }

.hx-spark circle { fill: var(--hx-lime); }

.hx-rows { padding: var(--s2) var(--s3); }
.hx-row { display: grid; grid-template-columns: 34px minmax(0, 1.3fr) minmax(0, 1.3fr) minmax(0, 1fr); align-items: center; gap: var(--s2); width: 100%; padding: 12px 8px; border: 0; border-top: 1px solid var(--hx-line); background: transparent; text-align: left; color: var(--color-ink); border-radius: 8px; transition: background 180ms ease-out; }
.hx-row:hover { background: rgba(var(--fg-rgb), .04); }
.hx-row-n { display: flex; flex-direction: column; min-width: 0; }
.hx-row-n b { font-weight: 600; font-size: 15px; }
.hx-row-n span { font-size: 12px; color: var(--color-slate); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hx-row-x { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.hx-into { font-family: var(--font-code); font-size: 11px; color: var(--color-slate); }
.hx-row-s { font-family: var(--font-code); font-size: 11.5px; color: var(--color-slate); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
body.neon .chip { background: rgba(255, 255, 255, .04); border-color: rgba(255, 255, 255, .14); color: var(--color-ink); }
body.neon .chip.w { background: rgba(255, 165, 82, .12); border-color: transparent; color: var(--color-orange); }
body.neon .pix { background: #E9EDF1; }

.hx-attn { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: var(--s3); align-items: start; }
.hx-alerts { display: grid; gap: var(--s3); }
.hx-alert { border-left: 2px solid var(--color-crimson); }
.hx-alert.degraded { border-left-color: var(--color-orange); }
.hx-alert.ok { border-left-color: var(--hx-lime); }
.hx-alert-b { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 14px; align-items: start; }
.hx-alert-b .pix { align-self: start; }
.hx-alert-b b { font-size: 16px; font-weight: 600; }
.hx-alert-b p { margin: 4px 0 12px; color: var(--color-ink); opacity: .85; font-size: 15px; }
.hx-alert.incident .hx-card-h .dim { color: var(--color-crimson); }
.hx-alert.degraded .hx-card-h .dim { color: var(--color-orange); }
.hx-alert dl { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 6px 12px; margin: 0 0 var(--s2); padding-left: 12px; border-left: 2px solid var(--hx-lime); font-size: 14px; }
.hx-alert dt { font-family: var(--font-code); font-size: 12px; color: var(--color-slate); }
.hx-alert dd { margin: 0; }
.hx-changes { display: flex; flex-direction: column; }
.hx-chg { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 4px; border: 0; border-top: 1px solid var(--hx-line); background: transparent; color: var(--color-ink); text-align: left; border-radius: 6px; }
.hx-chg:hover { background: rgba(var(--fg-rgb), .04); }
.hx-chg b { font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hx-foot, .hx-empty { margin: var(--s2) 0 0; font-size: 13px; color: var(--color-slate); }

.hx-iso-wrap { grid-column: span 1; }
.hx-iso { width: 100%; height: auto; overflow: visible; margin-top: 6px; }
.hx-iso .iso { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(.02); opacity: 0; transition: transform 1000ms cubic-bezier(.2, .7, .2, 1) var(--d), opacity 300ms ease-out var(--d); }
.in .hx-iso .iso { transform: none; opacity: 1; }
.hx-iso .f { fill: #1A1F24; }
.hx-iso .s { fill: #111518; }
.hx-iso .t { fill: #3A424B; }
.hx-iso .hot .f { fill: rgba(var(--acc-rgb), .55); }
.hx-iso .hot .s { fill: rgba(var(--acc-rgb), .3); }
.hx-iso .hot .t { fill: var(--hx-lime); }
.hx-iso .v { font: 500 12px var(--font-code); fill: var(--color-ink); text-anchor: middle; }
.hx-iso .l { font: 500 12px var(--font-code); fill: var(--color-slate); text-anchor: middle; }

.hx-act { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: var(--s3); }
.hx-heat-g { display: grid; grid-template-columns: 44px repeat(var(--cols), minmax(0, 1fr)); gap: 3px; align-items: center; }
.hx-heat-g i { display: block; height: 14px; border-radius: 3px; background: rgba(var(--acc-rgb), calc(.05 + var(--a) * .9)); box-shadow: 0 0 calc(var(--a) * 10px) rgba(var(--acc-rgb), calc(var(--a) * .5)); opacity: 0; transition: opacity 500ms ease-out; }
.in .hx-heat-g i { opacity: 1; }
.hx-heat-l { border: 0; background: none; padding: 0; color: var(--color-slate); font: 500 11px var(--font-code); text-align: left; cursor: pointer; }
.hx-heat-l:hover { color: var(--hx-lime); }
.hx-heat-x { font: 10.5px var(--font-code); color: var(--color-slate); white-space: nowrap; height: 18px; padding-top: 4px; }
.hx-ring { display: flex; flex-direction: column; align-items: center; text-align: center; }
.hx-ring-s { width: 170px; height: 170px; transform: rotate(-90deg); }
.hx-ring-s circle { fill: none; stroke-width: 8; }
.hx-ring-s .bg { stroke: rgba(var(--fg-rgb), .07); }
.hx-ring-s .fg { stroke: var(--hx-lime); stroke-linecap: round; stroke-dasharray: var(--c); stroke-dashoffset: var(--c); transition: stroke-dashoffset 1600ms cubic-bezier(.2, .7, .2, 1); filter: drop-shadow(0 0 6px rgba(var(--acc-rgb), .6)); }
.in .hx-ring-s .fg { stroke-dashoffset: var(--off); }
.hx-ring-v { font-size: 40px; font-weight: 600; letter-spacing: -.03em; margin-top: -112px; margin-bottom: 70px; }
.hx-ring p { color: var(--color-slate); font-size: 13px; margin: 0 0 var(--s2); }
.hx-ring-f { display: flex; justify-content: space-between; align-items: baseline; width: 100%; padding-top: 12px; border-top: 1px solid var(--hx-line); }
.hx-ring-f b { font-size: 20px; font-weight: 600; }

.hx-tiles { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: var(--s2); margin-bottom: var(--s3); }
.hx-tile { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: var(--s2) 6px; border-radius: 14px; border: 1px solid var(--hx-line); background: rgba(var(--fg-rgb), .025); transition: transform 200ms ease-out, border-color 200ms ease-out; }
.hx-tile:hover { transform: translateY(-3px); border-color: rgba(var(--acc-rgb), .5); }
.hx-tile-c { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(180deg, #1C2227, #12161A); border: 1px solid rgba(var(--fg-rgb), .1); font: 500 14px var(--font-code); color: #C8D0DA; box-shadow: inset 0 1px 0 rgba(var(--fg-rgb), .06); }
.hx-tile.hot .hx-tile-c { color: var(--on-acc); background: var(--hx-lime); border-color: var(--hx-lime); box-shadow: 0 0 22px rgba(var(--acc-rgb), .45); }
.hx-tile-n { font: 11px var(--font-code); color: var(--color-slate); line-height: 1.3; }
.hx-tile-v { font-size: 13px; font-weight: 600; }
.hx-two { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }
.hx-split { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; }
.hx-split i { width: var(--w); }
.hx-split .s0, .hx-split-l .s0 { background: var(--hx-lime); }
.hx-split .s1, .hx-split-l .s1 { background: var(--hx-cyan); }
.hx-split .s2, .hx-split-l .s2 { background: rgba(var(--fg-rgb), .35); }
.hx-split .s3, .hx-split-l .s3 { background: rgba(var(--fg-rgb), .15); }
.hx-split-l { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; font-size: 13px; color: var(--color-slate); }
.hx-split-l span { display: inline-flex; align-items: center; gap: 6px; }
.hx-split-l i { width: 8px; height: 8px; border-radius: 2px; }

.hx-lanes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s3); }
.hx-lane { display: flex; flex-direction: column; gap: 4px; min-height: 320px; }
.hx-lane.lit { border-color: rgba(var(--acc-rgb), .45); box-shadow: inset 0 1px 0 rgba(var(--fg-rgb), .05), 0 0 40px -10px rgba(var(--acc-rgb), .25); }
.hx-lane ul { list-style: none; margin: var(--s2) 0 var(--s3); padding: 0; display: grid; gap: 10px; }
.hx-lane li { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 14px; color: var(--color-ink); }
.hx-lane li .ic { width: 14px; height: 14px; }
.hx-lane li.ok .ic { color: var(--hx-lime); }
.hx-lane li.gap .ic { color: var(--color-orange); }
.hx-lane li b { font: 500 12px var(--font-code); color: var(--color-slate); }

.hx-close { padding-top: 120px; }
.hx-closing { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: var(--s3); }
.hx-brand { display: flex; flex-direction: column; justify-content: space-between; gap: var(--s3); min-height: 260px; }
.hx-brand p { font-size: 17px; line-height: 1.5; margin: 0; max-width: 34ch; }
.brand-mark.big { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 10px; background: var(--hx-lime); box-shadow: 0 0 24px rgba(var(--acc-rgb), .4); }
.brand-mark.big svg { fill: var(--on-acc); }
.hx-cta { padding: var(--s4); border-radius: 22px; background: var(--hx-lime); color: var(--on-acc); }
.hx-cta .hx-mono { color: var(--on-acc-2); }
.hx-cta .hx-h2 { color: var(--on-acc); margin-bottom: var(--s1); }
.hx-cta p { color: var(--on-acc-2); margin: 0 0 var(--s3); }
.hx-cta-go { display: flex; flex-wrap: wrap; gap: 8px; }
.hx-cta-go button { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; border: 0; background: var(--on-acc); color: #EEF1F4; font-size: 13px; transition: transform 180ms ease-out; }
.hx-cta-go button:hover { transform: translateY(-1px); }
.hx-cta-go b { color: var(--hx-lime); font: 500 12px var(--font-code); }
.hx-strip { display: flex; justify-content: space-between; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s4); padding: var(--s2) 0; border-top: 1px solid var(--hx-line); font: 12px var(--font-code); color: var(--color-slate); text-transform: lowercase; }
.hx-strip span { display: inline-flex; align-items: center; gap: 8px; }
.hx-strip i { width: 6px; height: 6px; border-radius: 50%; background: var(--hx-lime); }
.hx-strip i.warn { background: var(--color-orange); }
.hx-strip i.bad { background: var(--color-crimson); }

/* scroll reveal */
.rv { opacity: 0; transform: translateY(28px); filter: blur(6px); transition: opacity 800ms cubic-bezier(.2, .7, .2, 1), transform 800ms cubic-bezier(.2, .7, .2, 1), filter 800ms cubic-bezier(.2, .7, .2, 1); }
.rv.in { opacity: 1; transform: none; filter: none; }
@media (prefers-reduced-motion: reduce) {
  .rv { opacity: 1; transform: none; filter: none; transition: none; }
  .hx-status i, .hx-live i { animation: none; }
  .hx-minis i, .hx-iso .iso { transform: none; opacity: 1; transition: none; }
  .hx-blocks i, .hx-heat-g i { opacity: 1; transform: none; transition: none; }
  .hx-track i { width: var(--w); transition: none; }
  .hx-spark polyline { stroke-dashoffset: 0; transition: none; }
  .hx-ring-s .fg { stroke-dashoffset: var(--off); transition: none; }
  body.neon .one { transition: none; }
}
@media (max-width: 1100px) {
  .hx { padding: 0 var(--s4) var(--s8); }
    .hx-hero-main, .hx-head, .hx-attn, .hx-act, .hx-closing, .hx-two { grid-template-columns: 1fr; }
  .hx-kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .hx-stats { grid-template-columns: 1fr 1fr; gap: var(--s4); }
  .hx-iso-wrap { grid-column: 1 / -1; }
  .hx-tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .hx-lanes { grid-template-columns: 1fr; }
  .hx-row { grid-template-columns: 34px minmax(0, 1fr) minmax(0, 1fr); }
  .hx-row-s { display: none; }
  .hx-sec { padding-top: 88px; }
}

/* ---------- standard dark theme: shared components on every view */
body.neon { --ink-scrim: rgba(0, 0, 0, .62); --overlay-shadow: 0 40px 80px -20px rgba(0, 0, 0, .8); --color-frame: rgba(255, 255, 255, .03); }
body.neon input, body.neon select, body.neon textarea { background-color: rgba(255, 255, 255, .03); color: var(--color-ink); }
body.neon select option { background: #0E1215; color: var(--color-ink); }
body.neon #tt { background: #12171B; color: var(--color-ink); border: 1px solid var(--hx-line); }
body.neon #toast { background: #12171B; color: var(--color-ink); border: 1px solid var(--hx-line); }
body.neon .m-card, body.neon .f-card { background: #0B0E11; border: 1px solid var(--hx-line); border-radius: 20px; }
body.neon .btn { background: rgba(255, 255, 255, .04); border-color: var(--hx-line); color: var(--color-ink); }
body.neon .btn:hover { background: rgba(255, 255, 255, .08); }
body.neon .btn.primary { background: var(--hx-lime); border-color: var(--hx-lime); color: #0A0D08; border-radius: 999px; }
body.neon .btn.primary:hover { box-shadow: 0 0 22px rgba(198, 242, 78, .3); }
/* page headings: tight sans like the home page */
body.neon .bp-head h1, body.neon #m-title, body.neon .f-head h2 { font-family: var(--font-sans); font-weight: 600; letter-spacing: -.03em; }
body.neon .bp-head { background: linear-gradient(180deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .015)); border: 1px solid var(--hx-line); border-radius: 20px; }
body.neon .spark { background: rgba(255, 255, 255, .035); border: 1px solid var(--hx-line); border-radius: 14px; }
body.neon .spark .sd { fill: var(--hx-lime); stroke: none; }
body.neon .sec-h h2, body.neon .h3 { letter-spacing: -.02em; }
/* agent tiles as glass cards */
body.neon .tile { background: linear-gradient(180deg, rgba(255, 255, 255, .045), rgba(255, 255, 255, .012)); border-color: var(--hx-line); border-radius: 16px; }
body.neon .tile:hover { background: linear-gradient(180deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .02)); border-color: rgba(198, 242, 78, .35); }
body.neon .tile-step { background: rgba(255, 255, 255, .04); border-color: var(--hx-line); border-radius: 0 15px 0 var(--r-ctl); font-family: var(--font-code); font-size: 11px; text-transform: lowercase; }
body.neon .tile:hover .tile-step { background: rgba(198, 242, 78, .1); color: var(--hx-lime); }
body.neon .xrow:hover { background: rgba(255, 255, 255, .04); }
body.neon .chip.home { background: rgba(198, 242, 78, .1); border-color: rgba(198, 242, 78, .35); color: var(--hx-lime); }
body.neon .auto i { background: rgba(255, 255, 255, .15); }
body.neon .auto i.on { background: var(--hx-lime); }
body.neon .notice { border-color: var(--hx-line); }
body.neon .empty { border-color: var(--hx-line); }
body.neon pre.code { background: rgba(255, 255, 255, .03); border-color: var(--hx-line); color: #D7DEE6; }
body.neon .pix { background: #E9EDF1; }

/* ---------- theme switch: Neon (body.neon) and Light (body.light, the navy / sand / tangerine scheme) */
:root { --fg-rgb: 27, 42, 74; --acc-rgb: 27, 42, 74; --on-acc: #FFFFFF; --on-acc-2: rgba(255, 255, 255, .8);
  --hx-lime: #1B2A4A; --hx-cyan: #4F586C; --hx-line: #E6DCCB; --hx-glass: #FFFFFF; }
body.neon { --fg-rgb: 255, 255, 255; --acc-rgb: 198, 242, 78; --on-acc: #0A0D08; --on-acc-2: #2B3510; }
.lv-sheet { margin-top: var(--s2); overflow-x: auto; }
/* light: flat white cards and hairlines, no blur or glow */
body.light .hx-card, body.light .hx-map { background: var(--color-base); border-color: var(--color-mist); border-radius: var(--r-panel); box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
body.light .hx-lane.lit { border-color: var(--color-navy); box-shadow: none; }
body.light .hx-pill i, body.light .hx-status i, body.light .hx-live i { box-shadow: none; }
body.light .hx-btn.lime:hover, body.light .hx-tile.hot .hx-tile-c, body.light .brand-mark.big { box-shadow: none; }
body.light .hx-iso .f { fill: var(--color-mist); } body.light .hx-iso .s { fill: var(--color-sand); } body.light .hx-iso .t { fill: var(--surface); }
body.light .hx-iso .hot .f { fill: var(--color-navy); } body.light .hx-iso .hot .s { fill: var(--color-slate); } body.light .hx-iso .hot .t { fill: var(--color-tangerine); }
body.light .hx-tile-c { background: var(--surface); border-color: var(--color-mist); color: var(--color-ink); box-shadow: none; }
body.light .hx-spark polyline, body.light .hx-ring-s .fg { filter: none; }
body.light .hx-track i, body.light .hx-heat-g i, body.light .hx-blocks i.a3 { box-shadow: none; }
body.light .hx-minis i { background: var(--color-navy); }
body.light .hx-split .s1, body.light .hx-split-l .s1 { background: var(--color-tangerine); }

body.light .one .o-box, body.light .one .o-tok { filter: none; }
body.light .one .o-tok.away { filter: drop-shadow(0 3px 3px rgba(27, 42, 74, .25)); }
body.light .o-feed-w .hx-mono { color: var(--color-slate); }
body.light .o-feed li { display: flex; gap: 12px; align-items: center; font-family: var(--font-code); font-size: 12px; }

body.light .lv-sheet { padding: var(--s2) var(--s3) var(--s3); background: var(--color-frame); border-radius: var(--r-panel); }
/* neon: the deep dive in the same dark glass as the rest */
body.neon .lv-users { background: rgba(92, 200, 255, .04); border: 1px solid rgba(92, 200, 255, .18); border-bottom: 4px solid rgba(92, 200, 255, .35); }
body.neon .lv-agents { background: rgba(198, 242, 78, .05); color: var(--color-ink); border: 1px solid rgba(198, 242, 78, .2); border-bottom: 4px solid rgba(198, 242, 78, .45); }
body.neon .lv-data { background: rgba(255, 165, 82, .04); border: 1px solid rgba(255, 165, 82, .16); border-bottom: 4px solid rgba(255, 165, 82, .35); }
body.neon .lv-agents .lv-lab span, body.neon .lv-agents .lv-n { color: var(--color-slate); opacity: 1; }
body.neon .lv-users .lv-lab .ic { color: var(--hx-cyan); } body.neon .lv-agents .lv-lab .ic { color: var(--hx-lime); } body.neon .lv-data .lv-lab .ic { color: var(--color-orange); }
body.neon .lv-tier { border-bottom-color: var(--hx-line); font-family: var(--font-code); font-weight: 500; text-transform: lowercase; }
body.neon .lv-bu span { font-family: var(--font-code); font-size: 10px; }
body.neon .lv-grp { border-color: var(--hx-cyan); background: rgba(92, 200, 255, .12); }
body.neon .lv-ag { background: #E9EDF1; }
body.neon .lv-ag.np { background: transparent; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .4); }
body.neon .lv-ag.xw::after { border-color: #07090B; }
body.neon .lv-db { background: rgba(255, 255, 255, .04); border-color: rgba(255, 255, 255, .2); color: #C8D0DA; font-family: var(--font-code); font-weight: 500; }
body.neon .lv-db.c2 { background: rgba(198, 242, 78, .06); border-color: rgba(198, 242, 78, .45); color: var(--color-ink); }
body.neon .lv-db.c3 { background: rgba(198, 242, 78, .18); border-color: var(--hx-lime); color: var(--hx-lime); }
body.neon .lv-db.w { border-top: 3px solid var(--color-tangerine); }
body.neon .lv .lk { stroke-opacity: .1; }
body.neon .lv .lk.w { stroke-opacity: .35; }
body.neon .lv.focus .lk.on { stroke-opacity: .85; filter: drop-shadow(0 0 3px rgba(198, 242, 78, .6)); }
body.neon .lv .pt { stroke: #07090B; filter: drop-shadow(0 0 4px rgba(198, 242, 78, .8)); }
body.neon .lv .pt.w { filter: drop-shadow(0 0 4px rgba(242, 140, 40, .8)); }
body.neon .lv-cell.on { background: rgba(255, 255, 255, .05); }
/* brand mark follows the theme */
.brand-mark svg { fill: var(--color-tangerine); }
body.neon .brand-mark svg { fill: #0A0D08; }

/* ---------- process page: data view (source systems as tiles, datasets in a panel) */
.vtoggle .seg-btn .ic { width: 14px; height: 14px; }
.dtile { cursor: pointer; }
.dtile.on { border-color: var(--color-navy); box-shadow: inset 0 0 0 1px var(--color-navy); }
.dmark { display: grid; place-items: center; flex: none; width: 44px; height: 44px; border-radius: var(--r-ctl); background: var(--surface); border: 1px solid var(--color-mist); font: 600 14px var(--font-code); color: var(--color-ink); }
